<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragment/head :: common}"></th:block>
  <title>valenti - Study</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <th:block th:replace="~{fragment/head :: appStyles}"></th:block>
  <link th:href="@{/css/pages/home.css}" rel="stylesheet">
  <link th:href="@{/css/components/button.css}" rel="stylesheet">
  <link th:href="@{/css/pages/study.css}" rel="stylesheet">
</head>
<body>
<div class="dashboard-wrapper">
  <div th:replace="~{fragment/component :: sidebar(username=${username}, url='/study')}"></div>

  <main class="main-content">
    <div class="home-container">
      <header class="home-hero">
        <p class="hero-label">LEARN & IMPROVE</p>
        <h1>Chess <span class="blue-text">Study</span> Room</h1>
        <p class="hero-desc">전략적인 체스 실력 향상을 위한 학습 자료 공간입니다.</p>
      </header>

      <div class="study-grid">
        <div th:each="study : ${studies}" class="study-card"
             th:onclick="'location.href=\'/posts/' + ${study.postId} + '\''">
          <img th:if="${study instanceof T(org.spring.createa.chessvalenti.domain.Study) and !#strings.isEmpty(study.imageUrl)}"
               th:src="${study.imageUrl}" class="thumbnail" alt="Study Thumbnail">
          <div th:unless="${study instanceof T(org.spring.createa.chessvalenti.domain.Study) and !#strings.isEmpty(study.imageUrl)}"
               class="thumbnail thumbnail-placeholder">
            🎓
          </div>
          <div class="card-body">
            <div class="category">
              <span th:text="${study instanceof T(org.spring.createa.chessvalenti.domain.Study) ? study.difficulty : 'NOTICE'}">Difficulty</span>
            </div>
            <h3 th:text="${study.title}">루이 로페즈 (Ruy Lopez) 기초</h3>
            <p th:if="${study instanceof T(org.spring.createa.chessvalenti.domain.Study)}"
               th:text="${study.introduction}"></p>
          </div>
        </div>

        <!-- Static Fallback if no studies exist yet -->
        <div th:if="${#lists.isEmpty(studies)}" class="study-card study-card-empty">
          <div class="thumbnail thumbnail-placeholder">
            📭
          </div>
          <div class="card-body">
            <div class="category">System</div>
            <h3>등록된 강의가 없습니다.</h3>
            <p>새로운 체스 강의가 곧 업데이트될 예정입니다.</p>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
