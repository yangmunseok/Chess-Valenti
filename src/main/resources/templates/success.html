<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragment/head :: common}"></th:block>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <th:block th:replace="~{fragment/head :: appStyles}"></th:block>
  <link rel="stylesheet" th:href="@{/css/pages/success.css}">
</head>
<body>
<div
    th:replace="~{fragment/component :: sidebar(username=${username}, url='/payment/success')}"></div>
<div class="container full-height-center">
  <div class="success-full-card">
    <div class="success-header-visual">
      <div class="glow-orb"></div>
      <div class="check-animation">
        <svg class="checkmark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52">
          <circle class="checkmark__circle" cx="26" cy="26" r="25" fill="none"/>
          <path class="checkmark__check" fill="none" d="M14.1 27.2l7.1 7.2 16.7-16.8"/>
        </svg>
      </div>
    </div>

    <div class="success-content">
      <h1>후원이 완료되었습니다!</h1>
      <p class="thanks-msg"
         th:text="|${username}님의 소중한 후원은 더 정교한 분석 서비스를 만드는 데 큰 힘이 됩니다.|"></p>

      <div class="payment-summary">
        <div class="summary-item">
          <span>결제 금액</span>
          <strong id="display-amount"></strong>
        </div>
        <div class="summary-item">
          <span>후원 등급</span>
          <span class="tier-tag">Knight Tier</span>
        </div>
        <div class="summary-item">
          <span>결제 일시</span>
          <span id="display-date"></span>
        </div>
      </div>

      <div class="success-actions">
        <button class="stat-btn-primary" onclick="location.href='insight.html'">분석 페이지로 돌아가기
        </button>
        <button class="btn-outline-sm" onclick="window.print()">영수증 출력</button>
      </div>
    </div>

    <div class="share-section">
      <span>주변에 공유하기</span>
      <div class="share-icons">
        <button class="share-btn">🔗</button>
        <button class="share-btn">🐦</button>
      </div>
    </div>
  </div>
</div>
<script th:src="@{/js/pages/success.js}"></script>
</body>
</html>
