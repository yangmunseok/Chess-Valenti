<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>접근 권한이 없습니다 - valenti</title>
    <link th:href="@{/css/tokens.css}" rel="stylesheet">
    <th:block th:replace="~{fragment/head :: appStyles}"></th:block>
    <link th:href="@{/css/components/button.css}" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link th:href="@{/css/components/status-card.css}" rel="stylesheet">
</head>
<body>
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragment/component :: sidebar(username=${username}, url='/access-denied')}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="access-denied-card">
            <div class="icon-circle">🚫</div>
            <h2 class="message-title">접근 권한이 없습니다</h2>
            <p class="message-text">
                해당 페이지는 관리자 전용 구역입니다.<br>
                일반 사용자는 접근하실 수 없습니다.
            </p>
            <div class="btn-group">
                <a th:href="@{/}" class="btn btn-primary btn-lg btn-shadow">홈으로 돌아가기</a>
                <form th:action="@{/logout}" method="post" class="inline-form">
                    <button type="submit" class="btn btn-ghost btn-md">다른 계정으로 로그인</button>
                </form>
            </div>
        </div>
    </main>
</div>
</body>
</html>
