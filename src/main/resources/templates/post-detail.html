<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragment/head :: common}"></th:block>
  <title>Valenti - Post Detail</title>
  <link
      href="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.snow.css"
      rel="stylesheet"
  />
  <th:block th:replace="~{fragment/head :: appStyles}"></th:block>
  <link th:href="@{/css/pages/home.css}" rel="stylesheet">
  <link th:href="@{/css/pages/post.css}" rel="stylesheet">
  <link th:href="@{/css/components/editor.css}" rel="stylesheet">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body class="valenti-dark" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<div class="dashboard-wrapper">
  <div th:replace="~{fragment/component :: sidebar(username=${username}, url=${url})}"></div>
  <main class="main-content">
    <div class="home-container">
      <nav class="post-nav">
        <a href="javascript:history.back()" class="btn-back">← 목록으로 돌아가기</a>
      </nav>

      <article class="post-container">
        <header class="post-header">
          <div class="post-meta-top">
            <span th:if="${post instanceof T(org.spring.createa.chessvalenti.domain.Notice)}"
                  class="category-tag">NOTICE</span>
            <span th:if="${post instanceof T(org.spring.createa.chessvalenti.domain.FAQ)}"
                  class="category-tag">FAQ</span>
            <span th:if="${post instanceof T(org.spring.createa.chessvalenti.domain.Study)}"
                  class="category-tag">STUDY</span>

            <span th:if="${post instanceof T(org.spring.createa.chessvalenti.domain.Inquiry)}"
                  class="category-tag" th:text="${#strings.substring(post.category,8)}"></span>

            <span class="post-date"
                  th:text="${@timeUtil.format(post.createdAt,'yyyy-MM-dd HH:mm')}"></span>
          </div>
          <h1 class="post-title" th:text="${post.title}"></h1>
          <div class="author-meta"
               th:if="${post instanceof T(org.spring.createa.chessvalenti.domain.Inquiry)}">
            작성자: <span th:text="${post.writer.username}"></span>
          </div>
        </header>

        <section
            th:if="${post instanceof T(org.spring.createa.chessvalenti.domain.Study) and post.videoUrl != null and !#strings.isEmpty(post.videoUrl)}"
            class="post-video-container">
          <div class="video-wrapper">
            <iframe th:src="'https://www.youtube.com/embed/' + ${post.videoUrl}"
                    frameborder="0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    allowfullscreen>
            </iframe>
          </div>
        </section>

        <section class="post-content ql-snow">
          <div class="ql-editor" th:utext="${post.content}">
          </div>
        </section>

        <!-- 답변 영역 -->
        <section th:if="${post instanceof T(org.spring.createa.chessvalenti.domain.Inquiry)}"
                 class="reply-section">
          <div th:if="${post.answer != null}" class="answer-box">
            <div class="answer-header">
              <span class="answer-label">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path
                    d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                운영진 답변
              </span>
              <span class="answer-date"
                    th:text="${@timeUtil.format(post.answeredAt, 'yyyy-MM-dd HH:mm')}"></span>
            </div>
            <div class="answer-content"
                 th:utext="${post.answer}">
            </div>
          </div>

          <!-- 답변 작성 폼 (관리자 전용) -->
          <div sec:authorize="hasRole('ROLE_ADMIN')" class="admin-reply-form ql-snow">
            <h3 class="admin-reply-title">답변
              작성</h3>
            <div id="reply-editor"></div>
            <div class="admin-reply-actions">
              <button id="submit-reply" class="btn-comment-submit" th:data-id="${post.id}">답변 등록하기
              </button>
            </div>
          </div>
        </section>

        <!-- 댓글 영역 (FAQ 제외) -->
        <section
            th:if="${post instanceof T(org.spring.createa.chessvalenti.domain.Post) and post.type != T(org.spring.createa.chessvalenti.domain.PostType).FAQ}"
            class="comment-section">

          <h2 class="comment-section-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            댓글 <span class="comment-count" th:text="${totalCommentCount}">0</span>
          </h2>

          <!-- 댓글 목록 -->
          <div class="comment-list">
            <div th:each="comment : ${comments}" class="comment-container">
              <!-- 부모 댓글 -->
              <div class="comment-item">
                <div class="user-avatar comment-avatar"
                     th:text="${#strings.substring(comment.writer.username,0,1).toUpperCase()}">U
                </div>
                <div class="comment-body">
                  <div class="comment-meta">
                    <div class="comment-author-line">
                      <span class="comment-author"
                            th:text="${comment.writer.username}"></span>
                      <span class="comment-date"
                            th:text="${@timeUtil.format(comment.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                    </div>
                    <div class="comment-actions">
                      <button class="btn-reply auth-required"
                              th:onclick="|toggleReplyForm(${comment.id})|">답글
                      </button>
                      <button
                          th:if="${isLoggedIn and (#authentication.name == comment.writer.username or #authorization.expression('hasRole(''ADMIN'')'))}"
                          class="btn-delete-comment"
                          th:onclick="|deleteComment(${comment.id})|">삭제
                      </button>
                    </div>
                  </div>
                  <div class="comment-content"
                       th:text="${comment.content}">
                  </div>

                  <!-- 답글 작성 폼 (기본 숨김). display 는 post-detail.js 의 toggleReplyForm 이 style 로 바꾸므로 인라인에 둔다 -->
                  <div th:id="'reply-form-' + ${comment.id}" class="reply-form" style="display: none;">
                    <textarea th:id="'reply-input-' + ${comment.id}" placeholder="답글을 입력하세요..."></textarea>
                    <div class="reply-form-actions">
                      <button class="btn-reply-cancel"
                          th:onclick="|toggleReplyForm(${comment.id})|">취소
                      </button>
                      <button class="btn-comment-submit"
                              th:onclick="|submitReply(${comment.id}, ${post.postId})|">
                        답글 등록
                      </button>
                    </div>
                  </div>
                </div>
              </div>

              <!-- 자식 댓글 (대댓글) -->
              <div class="replies-container">
                <div th:each="reply : ${comment.children}" class="comment-item reply-item">
                  <div class="user-avatar comment-avatar"
                       th:text="${#strings.substring(reply.writer.username,0,1).toUpperCase()}">U
                  </div>
                  <div class="comment-body">
                    <div class="comment-meta">
                      <div class="comment-author-line">
                        <span class="comment-author"
                              th:text="${reply.writer.username}"></span>
                        <span class="comment-date"
                              th:text="${@timeUtil.format(reply.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                      </div>
                      <button
                          th:if="${#authentication.name == reply.writer.username or #authorization.expression('hasRole(''ADMIN'')')}"
                          class="btn-delete-comment"
                          th:onclick="|deleteComment(${reply.id})|">삭제
                      </button>
                    </div>
                    <div class="comment-content"
                         th:text="${reply.content}">
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div th:if="${#lists.isEmpty(comments)}" class="comment-empty">
              첫 번째 댓글을 남겨보세요!
            </div>
          </div>

          <!-- 댓글 작성 폼 -->
          <div class="comment-form-box">
            <textarea id="comment-input"
                      th:placeholder="${isLoggedIn ? '댓글을 입력하세요...' : '로그인 후 댓글을 작성할 수 있습니다.'}"
                      th:readonly="${!isLoggedIn}"></textarea>
            <div class="comment-form-actions">
              <button id="submit-comment" class="btn-comment-submit auth-required"
                      th:data-id="${post.postId}">
                댓글 등록
              </button>
            </div>
          </div>
        </section>

        <!--footer class="post-footer">
          <div class="author-info">
            <div class="avatar">V</div>
            <span>Admin Official</span>
          </div>
        </footer-->
      </article>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/quill@2/dist/quill.js"></script>
<script sec:authorize="hasRole('ROLE_ADMIN')" th:src="@{/js/pages/post-detail-admin.js}"></script>

<script th:src="@{/js/pages/post-detail.js}"></script>
</body>
</html>
