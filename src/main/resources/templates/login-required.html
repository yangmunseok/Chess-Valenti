<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인이 필요합니다 - valenti</title>
    <link th:href="@{/css/tokens.css}" rel="stylesheet">
    <th:block th:replace="~{fragment/head :: appStyles}"></th:block>
    <link th:href="@{/css/components/button.css}" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <link th:href="@{/css/components/status-card.css}" rel="stylesheet">
</head>
<body>
<div class="dashboard-wrapper">
    <!-- Sidebar -->
    <div th:replace="~{fragment/component :: sidebar(username='Guest', url='/login-required')}"></div>

    <!-- Main Content -->
    <main class="main-content">
        <div class="login-required-card">
            <div class="icon-circle">🔒</div>
            <h2 class="message-title">로그인이 필요한 서비스입니다</h2>
            <p class="message-text">
                요청하신 페이지는 회원 전용 서비스입니다.<br>
                로그인 후 더 많은 기능을 이용해 보세요.
            </p>
            <div class="btn-group">
                <a th:href="@{/login}" class="btn btn-primary btn-lg btn-shadow">로그인하러 가기</a>
                <a th:href="@{/}" class="btn btn-ghost btn-md">홈으로 돌아가기</a>
            </div>
        </div>
    </main>
</div>
</body>
</html>
