<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragment/head :: common}"></th:block>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

  <title>valenti Admin - Control Center</title>
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"/>

  <th:block th:replace="~{fragment/head :: appStyles}"></th:block>
  <link rel="stylesheet" th:href="@{/css/pages/admin.css}">
  <link th:href="@{/css/components/button.css}" rel="stylesheet">
</head>
<body class="admin-body">
<nav th:replace="~{fragment/component :: adminSidebar(url='/admin/support')}"></nav>
<main class="admin-main">
  <header class="admin-header">
    <h2>소통 및 문의 관리</h2>
  </header>
  <div class="admin-tabs" th:data-current="${mode}">
    <button id="tab-inquiry" class="tab-btn"
            onclick="window.location='/admin/support?mode=inquiry'">1:1 문의 내역
      <!--span
          class="badge-count">7</span--></button>
  </div>
  <div id="tab-inquiry-content" class="tab-content">
    <section
        th:replace="~{fragment/content :: inquirySection(inquiries=${inquiries},currentPage=${currentPage}, totalPages=${totalPages})}"></section>
  </div>
</main>
