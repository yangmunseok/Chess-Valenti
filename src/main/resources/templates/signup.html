<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <th:block th:replace="~{fragment/head :: common}"></th:block>
  <title>valenti - Sign Up</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
  <link th:href="@{/css/app.css}" rel="stylesheet">
  <link th:href="@{/css/login.css}" rel="stylesheet">
  <link th:href="@{/css/btn-refactor.css}" rel="stylesheet">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="logo">
      <div class="logo-dot"></div>
      valenti
    </div>

    <div class="login-header">
      <h1>계정 만들기</h1>
      <p>valenti와 함께 체스 실력을 분석해보세요.</p>
    </div>

    <form action="/signup" method="POST" class="login-form">
      <div class="input-group">
        <label for="email">이메일</label>
        <input type="email" id="email" name="email" placeholder="name@example.com" required>
      </div>

      <div class="input-group">
        <label for="username">사용자 이름</label>
        <input type="text" id="username" name="username" placeholder="영문, 숫자 4자 이상" required>
      </div>

      <div class="input-group">
        <label for="password">비밀번호</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required>
      </div>

      <div class="input-group">
        <label for="password-confirm">비밀번호 확인</label>
        <input type="password" id="password-confirm" name="passwordConfirm" placeholder="••••••••"
               required>
      </div>

      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}"/>

      <button id="signup-btn" type="submit" class="btn btn-primary btn-lg" disabled>가입하기</button>
    </form>

    <div class="footer-links">
      이미 계정이 있으신가요? <a href="/login">로그인</a>
    </div>
  </div>
</div>

</body>
<script th:src="@{/js/pages/signup.js}"></script>
</html>
